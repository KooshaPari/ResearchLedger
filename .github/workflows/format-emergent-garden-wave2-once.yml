name: Format Emergent Garden Wave 2 Once

on:
  push:
    branches:
      - docs/emergent-garden-nested-corpus-20260904
    paths:
      - .github/workflows/format-emergent-garden-wave2-once.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout corpus branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/emergent-garden-nested-corpus-20260904
          fetch-depth: 0

      - name: Format complete corpus
        shell: bash
        run: |
          set -euo pipefail
          npm install --global prettier@3.6.2
          prettier --write \
            'docs/corpora/emergent-garden/**/*.{md,json,yml,yaml}' \
            .github/workflows/emergent-garden-youtube-census.yml
          git rm .github/workflows/format-emergent-garden-wave2-once.yml

      - name: Commit formatted corpus and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No formatting changes to commit.'
            exit 0
          fi
          git commit -m 'style: format complete Emergent Garden Wave 2 corpus'
          git push origin HEAD:docs/emergent-garden-nested-corpus-20260904
