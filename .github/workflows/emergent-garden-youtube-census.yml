name: Emergent Garden YouTube Census

on:
  push:
    branches:
      - docs/emergent-garden-nested-corpus-20260904
    paths:
      - scripts/research/collect_emergent_garden_youtube.py
      - scripts/research/build_emergent_garden_link_frontier.py
      - .github/workflows/emergent-garden-youtube-census.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: emergent-garden-youtube-census
  cancel-in-progress: false

jobs:
  census:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
      INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID || secrets.INFISICAL_PROJECT_ID || '8efe392e-56a6-4c3c-89f9-8141183dd7e8' }}
      INFISICAL_ENV: ${{ vars.INFISICAL_ENV || github.ref == 'refs/heads/main' && 'prod' || github.ref == 'refs/heads/staging' && 'staging' || 'dev' }}
    steps:
      - name: Checkout corpus branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/emergent-garden-nested-corpus-20260904
          fetch-depth: 0

      - name: Validate collectors
        shell: bash
        run: |
          python3 -m py_compile \
            scripts/research/collect_emergent_garden_youtube.py \
            scripts/research/build_emergent_garden_link_frontier.py

      - name: Install Infisical CLI when needed
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$YOUTUBE_API_KEY" ] || [ -z "$INFISICAL_TOKEN" ]; then
            echo 'Infisical CLI not required for this run.'
            exit 0
          fi
          curl -1sLf 'https://dl.cloudsmith.io/public/infisical/infisical-cli/setup.deb.sh' | sudo -E bash
          sudo apt-get install -y infisical

      - name: Collect normalized census
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$YOUTUBE_API_KEY" ]; then
            echo 'Using repository-scoped YouTube API credential.'
            YOUTUBE_API_KEY_SOURCE=repository_secret \
              python3 scripts/research/collect_emergent_garden_youtube.py
          elif [ -n "$INFISICAL_TOKEN" ]; then
            echo 'Checking the isolated Infisical environment for a YouTube API credential.'
            if ! infisical run \
              --projectId "$INFISICAL_PROJECT_ID" \
              --env "$INFISICAL_ENV" \
              --token "$INFISICAL_TOKEN" \
              -- bash -ceu '
                if [ -n "${YOUTUBE_API_KEY:-}" ]; then
                  export YOUTUBE_API_KEY_SOURCE=infisical
                fi
                python3 scripts/research/collect_emergent_garden_youtube.py
              '; then
              echo '::warning::Infisical execution failed; recording the official Atom-feed fallback instead.'
              unset YOUTUBE_API_KEY
              python3 scripts/research/collect_emergent_garden_youtube.py
            fi
          else
            echo '::notice::No YouTube API credential source is configured; recording the official Atom-feed fallback.'
            python3 scripts/research/collect_emergent_garden_youtube.py
          fi

      - name: Expand high-value direct links
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/research/build_emergent_garden_link_frontier.py

      - name: Validate and format generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('docs/corpora/emergent-garden/data')
          paths = [
              *sorted(root.glob('youtube-*-v1.json')),
              root / 'direct-link-frontier-v1.json',
          ]
          for path in paths:
              json.loads(path.read_text(encoding='utf-8'))
              print(f'validated {path}')
          PY
          npm install --global prettier@3.6.2
          prettier --write \
            docs/corpora/emergent-garden/data/youtube-channel-inventory-v1.json \
            docs/corpora/emergent-garden/data/youtube-text-coverage-v1.json \
            docs/corpora/emergent-garden/data/youtube-description-edges-v1.json \
            docs/corpora/emergent-garden/data/youtube-census-status-v1.json \
            docs/corpora/emergent-garden/data/direct-link-frontier-v1.json \
            docs/corpora/emergent-garden/research/YOUTUBE-CENSUS-WAVE-2.md \
            docs/corpora/emergent-garden/research/DIRECT-LINK-EXPANSION-WAVE-2.md

      - name: Commit census and direct-link results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            docs/corpora/emergent-garden/data/youtube-channel-inventory-v1.json \
            docs/corpora/emergent-garden/data/youtube-text-coverage-v1.json \
            docs/corpora/emergent-garden/data/youtube-description-edges-v1.json \
            docs/corpora/emergent-garden/data/youtube-census-status-v1.json \
            docs/corpora/emergent-garden/data/direct-link-frontier-v1.json \
            docs/corpora/emergent-garden/research/YOUTUBE-CENSUS-WAVE-2.md \
            docs/corpora/emergent-garden/research/DIRECT-LINK-EXPANSION-WAVE-2.md
          if git diff --cached --quiet; then
            echo 'No census or direct-link changes to commit.'
            exit 0
          fi
          git commit -m 'data(research): refresh Emergent Garden direct graph'
          git push origin HEAD:docs/emergent-garden-nested-corpus-20260904
