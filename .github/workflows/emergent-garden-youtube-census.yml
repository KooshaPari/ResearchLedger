name: Emergent Garden YouTube Census

on:
  push:
    branches:
      - docs/emergent-garden-nested-corpus-20260904
    paths:
      - scripts/research/collect_emergent_garden_youtube.py
      - .github/workflows/emergent-garden-youtube-census.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: emergent-garden-youtube-census
  cancel-in-progress: false

jobs:
  census:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - name: Checkout corpus branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/emergent-garden-nested-corpus-20260904
          fetch-depth: 0

      - name: Validate collector
        shell: bash
        run: python3 -m py_compile scripts/research/collect_emergent_garden_youtube.py

      - name: Collect normalized census
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/research/collect_emergent_garden_youtube.py

      - name: Validate and format generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('docs/corpora/emergent-garden/data')
          for path in sorted(root.glob('youtube-*-v1.json')):
              json.loads(path.read_text(encoding='utf-8'))
              print(f'validated {path}')
          PY
          npm install --global prettier@3.6.2
          prettier --write \
            docs/corpora/emergent-garden/data/youtube-channel-inventory-v1.json \
            docs/corpora/emergent-garden/data/youtube-text-coverage-v1.json \
            docs/corpora/emergent-garden/data/youtube-description-edges-v1.json \
            docs/corpora/emergent-garden/data/youtube-census-status-v1.json \
            docs/corpora/emergent-garden/research/YOUTUBE-CENSUS-WAVE-2.md

      - name: Commit census result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            docs/corpora/emergent-garden/data/youtube-channel-inventory-v1.json \
            docs/corpora/emergent-garden/data/youtube-text-coverage-v1.json \
            docs/corpora/emergent-garden/data/youtube-description-edges-v1.json \
            docs/corpora/emergent-garden/data/youtube-census-status-v1.json \
            docs/corpora/emergent-garden/research/YOUTUBE-CENSUS-WAVE-2.md
          if git diff --cached --quiet; then
            echo 'No census changes to commit.'
            exit 0
          fi
          git commit -m 'data(research): capture Emergent Garden YouTube census'
          git push origin HEAD:docs/emergent-garden-nested-corpus-20260904
