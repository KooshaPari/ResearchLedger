name: Emergent Garden Wave 5 Primary Evidence

on:
  push:
    branches:
      - docs/emergent-garden-nested-corpus-20260904
    paths:
      - .github/workflows/emergent-garden-wave5-intake.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact capture revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Capture fixed public targets without executing source code
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/research/capture_wave5_primary_evidence.py
          python3 scripts/research/capture_wave5_primary_evidence.py --output "$RUNNER_TEMP/wave5-evidence"
      - name: Export receipts and attributed CC BY-SA paper
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: emergent-garden-wave5-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/wave5-evidence/
          retention-days: 1
          if-no-files-found: error
