name: Emergent Garden Comment Research

on:
  push:
    branches:
      - docs/emergent-garden-nested-corpus-20260904
    paths:
      - .github/workflows/emergent-garden-comments-research.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emergent-garden-comment-intake
  cancel-in-progress: false

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact research revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Test comments and replies offline
        run: python3 -m unittest discover -s scripts/research -p test_emergent_garden_comments.py -v

      - name: Capture public comments and description input
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/eg-private" "$RUNNER_TEMP/eg-public"
          python3 scripts/research/collect_emergent_garden_comments.py \
            --private "$RUNNER_TEMP/eg-private" \
            --public "$RUNNER_TEMP/eg-public" \
            --max-requests 6000

      - name: Seal private evidence for this research session
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/eg-private/repository-inputs" "$RUNNER_TEMP/eg-sealed"
          cp -R docs/corpora/emergent-garden "$RUNNER_TEMP/eg-private/repository-inputs/"
          cp -R scripts/research "$RUNNER_TEMP/eg-private/repository-inputs/"
          cp AGENTS.md "$RUNNER_TEMP/eg-private/repository-inputs/"
          git rev-parse HEAD > "$RUNNER_TEMP/eg-private/repository-inputs/SOURCE-COMMIT"
          cat > "$RUNNER_TEMP/eg-session-cert.pem" <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIIENzCCAp+gAwIBAgIUIkpQgXrqDdb0znwiEFzCI9AV4Y8wDQYJKoZIhvcNAQEL
