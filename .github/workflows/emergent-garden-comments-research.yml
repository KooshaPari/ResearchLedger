          openssl cms -encrypt -binary -aes-256-gcm -in "$RUNNER_TEMP/eg-input.tgz" \
            -outform DER -out "$RUNNER_TEMP/eg-sealed/research-input.cms" "$RUNNER_TEMP/eg-session-cert.pem"
          cp "$RUNNER_TEMP/eg-public/comment-coverage-v1.json" "$RUNNER_TEMP/eg-sealed/"
          cd "$RUNNER_TEMP/eg-sealed"
          sha256sum research-input.cms comment-coverage-v1.json > SHA256SUMS
          rm -f "$RUNNER_TEMP/eg-input.tgz"

      - name: Upload only sealed research input and coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: emergent-garden-comments-sealed-${{ github.run_id }}
          path: ${{ runner.temp }}/eg-sealed/
          retention-days: 1
          if-no-files-found: error
