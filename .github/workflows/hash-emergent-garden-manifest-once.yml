name: Hash Emergent Garden Manifest Once

on:
  push:
    branches:
      - docs/emergent-garden-nested-corpus-20260904

permissions:
  contents: write

jobs:
  hash:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/emergent-garden-nested-corpus-20260904
          fetch-depth: 0

      - name: Generate manifest digest
        shell: bash
        run: |
          set -euo pipefail
          cd docs/corpora/emergent-garden/data
          sha256sum wave-1-source-manifest.json > wave-1-source-manifest.sha256
          cd - >/dev/null
          git rm .github/workflows/hash-emergent-garden-manifest-once.yml

      - name: Commit digest and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/corpora/emergent-garden/data/wave-1-source-manifest.sha256
          git add -u .github/workflows
          git commit -m 'docs(content): freeze emergent garden source-manifest digest'
          git push origin HEAD:docs/emergent-garden-nested-corpus-20260904
