name: Retroactive Review Sweep

on:
  pull_request_review:
    types: [submitted, edited, dismissed]
  issue_comment:
    types: [created, edited]
  schedule:
    # Weekly on Sunday 03:00 UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      since_days:
        description: "Lookback window in days (default 7)"
        required: false
        type: number
        default: 7
      max_prs:
        description: "Max PRs to scan per repo (default 50)"
        required: false
        type: number
        default: 50
      include_bot_authors:
        description: "Include comments authored by bots"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Dry-run only (no issues/draft PRs created)"
        required: false
        type: boolean
        default: false
      repos:
        description: "JSON list of owner/repo pairs (default: current repository)"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      since_days:
        description: "Lookback window in days"
        required: false
        type: number
        default: 7
      max_prs:
        description: "Max PRs to scan per repo"
        required: false
        type: number
        default: 50
      include_bot_authors:
        description: "Include comments authored by bots"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Dry-run only (no issues/draft PRs created)"
        required: false
        type: boolean
        default: false
      repos:
        description: "JSON list of owner/repo pairs (default: caller)"
        required: false
        type: string
        default: ""
permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: retroactive-sweep
  cancel-in-progress: false

jobs:
  scan:
    name: Scan historical review comments
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REVIEW_SURFACE_URL: ${{ vars.REVIEW_SURFACE_URL || 'https://review.phenotype.internal' }}
      REVIEW_SURFACE_TOKEN: ${{ secrets.REVIEW_SURFACE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Resolve scan parameters
        id: params
        run: |
          {
            echo "lookback=${LOOKBACK:-30}"
            echo "max_prs=${MAX_PRS:-20}"
            echo "repo=${REPO_OVERRIDE:-${{ github.repository }}}"
            echo "dry_run=${DRY_RUN:-true}"
          } >> "$GITHUB_OUTPUT"
        env:
          LOOKBACK: ${{ inputs.since_days }}
          MAX_PRS: ${{ inputs.max_prs }}
          REPO_OVERRIDE: ${{ inputs.repos }}
          DRY_RUN: ${{ inputs.dry_run }}

      - name: Run scanner
        id: scan
        run: |
          python3 - <<'PY'
          import os, sys, json, urllib.request, urllib.error, subprocess, datetime
          from scripts.retroactive_sweep import parse_repositories

          lookback = int(os.environ.get("LOOKBACK_OVERRIDE") or "30")
          max_prs = int(os.environ.get("MAX_PRS_OVERRIDE") or "20")
          try:
              repos = parse_repositories(os.environ.get("REPO_OVERRIDE", ""), os.environ["GITHUB_REPOSITORY"])
          except ValueError as error:
              print(f"SCAN_FAIL: {error}", file=sys.stderr)
              sys.exit(1)
          dry_run = (os.environ.get("DRY_RUN_OVERRIDE") or "true").lower() == "true"
          review_url = os.environ.get("REVIEW_SURFACE_URL", "")
          review_token = os.environ.get("REVIEW_SURFACE_TOKEN", "")

          if not review_token:
              print("No REVIEW_SURFACE_TOKEN; running scanner locally with gh CLI.")
              # Local fallback: walk PRs via gh api
              cutoff = (datetime.datetime.utcnow() - datetime.timedelta(days=lookback)).isoformat() + "Z"
              findings = []
              scanned = 0
              for repo in repos:
                  list_payload = subprocess.check_output([
                      "gh", "api", f"repos/{repo}/pulls?state=closed&per_page={max_prs}&sort=updated&direction=desc",
                  ])
                  prs = [p for p in json.loads(list_payload) if p["updated_at"] >= cutoff]
                  scanned += len(prs)
                  for p in prs:
                      number = p["number"]
                      comments = json.loads(subprocess.check_output(["gh", "api", f"repos/{repo}/pulls/{number}/comments?per_page=50"]))
                      reviews = json.loads(subprocess.check_output(["gh", "api", f"repos/{repo}/pulls/{number}/reviews?per_page=50"]))
                      ignored = [c for c in comments + [r for r in reviews if r.get("body")]
                                 if c.get("body") and ("nit:" in c["body"].lower() or "style:" in c["body"].lower())]
                      if ignored:
                          findings.append({"repo": repo, "pr": number, "title": p["title"], "url": p["html_url"], "ignored_count": len(ignored)})
              print(json.dumps({"findings": findings[:10], "scanned": scanned, "dry_run": dry_run}, indent=2))
          else:
              endpoint = f"{review_url.rstrip('/')}/api/scan"
              try:
                  for repo in repos:
                      owner, name = repo.split("/", 1)
                      payload = {"owner": owner, "repo": name, "max_prs": max_prs, "dry_run": dry_run}
                      req = urllib.request.Request(endpoint, data=json.dumps(payload).encode(), headers={"Content-Type": "application/json", "Authorization": f"Bearer {review_token}"}, method="POST")
                      with urllib.request.urlopen(req, timeout=120) as r:
                          print(json.dumps(json.loads(r.read()), indent=2))
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", errors="replace")
                  print(f"Scan HTTP error: {e.code} {e.reason}\n{body}", file=sys.stderr)
                  sys.exit(1)
              except urllib.error.URLError as e:
                  print(f"Scan URL error: {e.reason}", file=sys.stderr)
                  sys.exit(1)
          PY
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          LOOKBACK_OVERRIDE: ${{ steps.params.outputs.lookback }}
          MAX_PRS_OVERRIDE: ${{ steps.params.outputs.max_prs }}
          REPO_OVERRIDE: ${{ steps.params.outputs.repo }}
          DRY_RUN_OVERRIDE: ${{ steps.params.outputs.dry_run }}

      - name: Summarize
        if: always()
        run: |
          {
            echo "## Retroactive sweep summary"
            echo "- Repo: ${{ steps.params.outputs.repo }}"
            echo "- Lookback: ${{ steps.params.outputs.lookback }} days"
            echo "- Max PRs: ${{ steps.params.outputs.max_prs }}"
            echo "- Dry run: ${{ steps.params.outputs.dry_run }}"
            echo "- Scan outcome: ${{ steps.scan.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
