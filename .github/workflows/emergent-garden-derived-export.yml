name: Emergent Garden Derived Export

on:
  push:
    branches:
      - docs/emergent-garden-nested-corpus-20260904
    paths:
      - .github/workflows/emergent-garden-derived-export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run existing offline research tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/eg-derived/validation"
          python3 -m unittest discover -s scripts/research -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/eg-derived/validation/offline-tests.txt"
          python3 scripts/research/check_activation_parameterization.py > "$RUNNER_TEMP/eg-derived/validation/parameterization.json"
      - name: Export only checked-in derived research
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'eg-derived'
          for rel in ('docs/corpora/emergent-garden', 'scripts/research'):
              for src in Path(rel).rglob('*'):
                  if src.is_file() and '__pycache__' not in src.parts and src.suffix in {'.md', '.json', '.yaml', '.yml', '.py', '.sha256'}:
                      dst = out / rel
                      target = dst / src.relative_to(rel)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copyfile(src, target)
          shutil.copyfile('AGENTS.md', out / 'RESEARCHLEDGER-AGENTS.md')
          (out / 'SOURCE.json').write_text(json.dumps({'repository':'KooshaPari/ResearchLedger', 'commit':os.environ['SOURCE_SHA'], 'workflow_run':os.environ['GITHUB_RUN_ID'], 'scope':'checked-in derived corpus and research scripts only; excludes private comments, transcripts, credentials and media'}, indent=2)+'\n')
          rows = [{'path':str(p.relative_to(out)), 'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(out.rglob('*')) if p.is_file()]
          (out / 'EXPORT-MANIFEST.json').write_text(json.dumps({'files':rows},indent=2)+'\n')
          print(json.dumps({'exported_files':len(rows), 'source':os.environ['SOURCE_SHA']}))
          PY
      - name: Attach derived export
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: emergent-garden-derived-${{ github.run_id }}
          path: ${{ runner.temp }}/eg-derived/
          retention-days: 7
          if-no-files-found: error
