[package]
name = "researchledger"
version = "0.1.0"
description = "Local-first research ledger"
authors = ["ResearchLedger"]
edition = "2021"

[lib]
name = "researchledger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

