name: Release

# Tier-0 fleet-standard release workflow.
# Publishes a Python wheel/sdist to PyPI on commit messages containing
# `release:` or `chore(release)`, then promotes the build to a staging
# channel via the shared phenotypeActions action.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'

# Concurrency hardening: cancel in-flight runs for the same ref so PR
# re-pushes do not queue up redundant release attempts.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build & publish to PyPI
    runs-on: ubuntu-latest
    if: |
      contains(github.event.head_commit.message, 'release:') ||
      contains(github.event.head_commit.message, 'chore(release)')
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build
        run: python -m build

      - name: Determine version
        id: version
        run: |
          VERSION=$(grep '^version' pyproject.toml | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

  promote:
    name: Promote to staging
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Promote to staging
        uses: KooshaPari/phenotypeActions/promote@main
        with:
          version: ${{ needs.release.outputs.version }}
          channel: beta
          registry: pypi
