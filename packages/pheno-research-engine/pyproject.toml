[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["pyright>=1.1.390"]

[project]
name = "phenotype-research-engine"
version = "0.1.0"
description = "Phenotype REPO package"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Claude Code", email = "claude@anthropic.com"}]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "phenotype-py-utils @ git+https://github.com/KooshaPari/phenotype-py-utils.git@v0.1.0",
]

[project.urls]
repository = "https://github.com/KooshaPari/phenotype-research-engine"
